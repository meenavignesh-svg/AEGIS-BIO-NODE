name: Validate static app

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  static-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check application module syntax
        run: |
          node -e "const fs=require('fs');const h=fs.readFileSync('index.html','utf8');const m=h.match(/<script type=\\"module\\">([\\s\\S]*?)<\\/script>/);if(!m)throw new Error('module script not found');fs.writeFileSync('/tmp/aegis-module-check.mjs',m[1]);"
          node --check /tmp/aegis-module-check.mjs
